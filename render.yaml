# Render blueprint for the API and its database.
#
# The frontend is NOT deployed here -- it is a static build on Vercel, so it is
# served from a CDN and stays warm even when this service is asleep. See
# frontend/vercel.json.
#
# Create both from this file with Render's "New > Blueprint" flow, pointed at
# this repository.

services:
  - type: web
    name: lingua-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build && npm run migrate
    startCommand: npm start
    # Render restarts the service if this stops returning 2xx. It runs SELECT 1,
    # so a dead database shows up as unhealthy rather than silently serving 500s.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lingua-db
          property: connectionString
      # Generated once by Render and never checked in. Changing it invalidates
      # every issued token, signing all users out.
      - key: JWT_SECRET
        generateValue: true
      # sync:false means "prompt me for this", so the key is entered in the
      # dashboard and never stored in the repository.
      - key: ANTHROPIC_API_KEY
        sync: false
      # The Vercel origin(s) allowed to call this API, comma-separated.
      # Set after the frontend is deployed and its URL is known.
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: lingua-db
    plan: free
    region: oregon
    # Render's free Postgres is deleted after 30 days. Everything here is
    # reproducible -- `npm run migrate` rebuilds the schema from
    # database/migrations -- but user accounts and lessons are not.
